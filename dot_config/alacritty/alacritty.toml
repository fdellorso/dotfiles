[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 13.0

[env]
TERM = "xterm-256color"

[scrolling]
history = 10000

[cursor]
style = { shape = "Block", blinking = "On" }

[colors.primary]
background = "#282A2E"
foreground = "#C5C8C6"

[colors.normal]
black = "#21222C"
red = "#FF5555"
green = "#50FA7B"
yellow = "#F1FA8C"
blue = "#BD93F9"
magenta = "#FF79C6"
cyan = "#8BE9FD"
white = "#F8F8F2"

[colors.bright]
black = "#6272A4"
red = "#FF6E6E"
green = "#69FF94"
yellow = "#FFFFA5"
blue = "#D6ACFF"
magenta = "#FF92DF"
cyan = "#A4FFFF"
white = "#FFFFFF"
