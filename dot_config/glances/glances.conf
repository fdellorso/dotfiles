# Glances — tutto attivo, UI ottimizzata (i3/Alacritty)
# Priorità: CLI > questo file > /etc/glances/glances.conf

[global]
# Refresh ogni 2s: reattivo senza flicker
refresh=2
# ~20 min di grafici con refresh 2s
history_size=600
# Niente controllo update (rolling: ci pensa yay)
check_update=False

[outputs]
# Separatore visivo tra top e plugin
separator=True
# Ordine colonna sinistra: prima risorse, poi GPU/docker, poi resto
left_menu=cpu,mem,swap,load,gpu,docker,fs,diskio,network,sensors,connections,ports,irq,folders,uptime
# Lista processi compatta
max_processes_display=20

[cpu]
disable=False
refresh=2
# Soglie uso utente: verde <50, giallo <70, rosso 90+
user_careful=50
user_warning=70
user_critical=90
# iowait più sensibile: disco che arranca si vede subito
iowait_careful=20
iowait_warning=40
iowait_critical=60
system_careful=50
system_warning=70
system_critical=90

[mem]
disable=False
refresh=2
# 32G RAM: giallo a ~26G, rosso a ~29G
mem_careful=60
mem_warning=80
mem_critical=90
swap_careful=30
swap_warning=50
swap_critical=70

[fs]
disable=False
refresh=30
# Root al 57%: preavviso a 70, urgente a 90
fs_careful=70
fs_warning=80
fs_critical=90

[docker]
# Container sempre visibili (immich, harp, dockhand…)
disable=False

[gpu]
# Quadro P2000 via NVML
disable=False

[network]
disable=False
refresh=3

[sensors]
# Temp/fan in vista (56°C GPU in idle si nota)
disable=False

[diskio]
disable=False
